<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorePass demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #0f1412;
        --bg1: #1a2420;
        --ink: #e8f0ea;
        --muted: #8fa396;
        --accent: #3ecf8e;
        --accent-2: #f0c14a;
        --panel: rgba(255, 255, 255, 0.04);
        --line: rgba(232, 240, 234, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #1f3d32 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #3a2f14 0%, transparent 50%),
          linear-gradient(160deg, var(--bg0), var(--bg1));
      }

      main {
        width: min(920px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3rem 0 4rem;
      }

      .brand {
        font-size: clamp(2.8rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        margin: 0;
      }

      .brand span {
        color: var(--accent);
      }

      .lede {
        margin: 0.75rem 0 2rem;
        max-width: 36rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .stage {
        position: relative;
        height: 280px;
        border: 1px solid var(--line);
        background: var(--panel);
        overflow: hidden;
      }

      .box {
        position: absolute;
        top: 100px;
        left: 40px;
        width: 72px;
        height: 72px;
        background: linear-gradient(145deg, var(--accent), #1f8f5f);
        box-shadow: 0 12px 40px rgba(62, 207, 142, 0.25);
      }

      .box.alt {
        left: 40px;
        top: 100px;
        background: linear-gradient(145deg, var(--accent-2), #b8891f);
        opacity: 0.2;
        transform: scale(0.6);
      }

      .dots {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }

      .stage.show-dots .box {
        display: none;
      }

      .stage.show-dots .dots {
        display: flex;
      }

      .dot {
        width: 28px;
        height: 28px;
        background: var(--accent);
        opacity: 0.25;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        margin-top: 1.25rem;
      }

      button {
        font: 600 0.9rem "JetBrains Mono", monospace;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 0.65rem 0.9rem;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      pre {
        margin-top: 1.5rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.28);
        overflow: auto;
        font: 0.85rem/1.55 "JetBrains Mono", monospace;
        color: #cfe6d6;
      }

      .scroll-space {
        height: 70vh;
      }

      .scroll-section {
        position: relative;
        min-height: 60vh;
        border: 1px solid var(--line);
        background: var(--panel);
        margin: 2rem 0 4rem;
        overflow: hidden;
      }

      .scroll-section p {
        margin: 1.25rem;
        color: var(--muted);
      }

      #scroll-box {
        position: absolute;
        left: 40px;
        top: 40%;
        width: 72px;
        height: 72px;
        background: linear-gradient(145deg, var(--accent), #1f8f5f);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">MorePass</h1>
      <p class="lede">
        A small modern tween library — tweens, timeline, stagger, scrollTrigger,
        colors, and overwrite.
      </p>

      <div class="stage" id="stage">
        <div class="box" id="box"></div>
        <div class="box alt" id="box2"></div>
        <div class="dots" id="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="controls">
        <button id="to">to()</button>
        <button id="from">from()</button>
        <button id="fromTo">fromTo()</button>
        <button id="timeline">timeline()</button>
        <button id="stagger">stagger</button>
        <button id="scroll">scrollTrigger</button>
        <button id="color">color</button>
        <button id="overwrite">overwrite</button>
        <button id="yoyo">yoyo + repeat</button>
        <button id="pause">pause / play</button>
        <button id="reset">reset</button>
      </div>

      <pre id="code"></pre>

      <div class="scroll-space" aria-hidden="true"></div>
      <section class="scroll-section" id="scroll-section">
        <p>Scroll this section — the box is scrubbed by ScrollTrigger.</p>
        <div id="scroll-box"></div>
      </section>
      <div class="scroll-space" aria-hidden="true"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
