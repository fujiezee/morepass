<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MorePass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #040a07;
        --ink: #f3faf5;
        --muted: #8eab97;
        --accent: #2fe39a;
        --accent-2: #ffc857;
        --line: rgba(238, 246, 240, 0.16);
        --glass: rgba(6, 22, 14, 0.62);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        font-family: "IBM Plex Mono", monospace;
        background: var(--bg);
        overflow-x: hidden;
      }

      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 90% 55% at 50% -18%, #1c4a36 0%, transparent 58%),
          radial-gradient(circle 480px at 88% 8%, rgba(255, 200, 87, 0.22), transparent 62%),
          radial-gradient(circle 560px at 4% 72%, rgba(47, 227, 154, 0.2), transparent 58%),
          radial-gradient(circle 320px at 55% 110%, rgba(47, 227, 154, 0.1), transparent 50%),
          linear-gradient(180deg, #07150f 0%, var(--bg) 42%, #020504 100%);
      }

      .sky::before {
        content: "";
        position: absolute;
        inset: -20% -10% auto;
        height: 55%;
        background: conic-gradient(
          from 210deg at 50% 80%,
          transparent 0deg,
          rgba(47, 227, 154, 0.08) 40deg,
          rgba(255, 200, 87, 0.1) 90deg,
          rgba(47, 227, 154, 0.06) 140deg,
          transparent 200deg
        );
        filter: blur(28px);
        opacity: 0.9;
      }

      .sky::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.28;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      .aurora {
        position: fixed;
        left: -20%;
        top: 18%;
        width: 70%;
        height: 220px;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(
          100deg,
          transparent 0%,
          rgba(47, 227, 154, 0.18) 35%,
          rgba(255, 200, 87, 0.14) 55%,
          transparent 80%
        );
        filter: blur(36px);
        opacity: 0.55;
        transform: rotate(-8deg);
      }

      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(52px);
        opacity: 0.55;
        pointer-events: none;
        z-index: 0;
        will-change: transform;
      }

      .orb-a {
        width: 340px;
        height: 340px;
        left: -70px;
        top: 16%;
        background: #24a86a;
      }

      .orb-b {
        width: 280px;
        height: 280px;
        right: -50px;
        top: 4%;
        background: #d4a028;
      }

      .orb-c {
        width: 240px;
        height: 240px;
        right: 14%;
        bottom: 8%;
        background: #1f7a55;
      }

      .app {
        position: relative;
        z-index: 1;
        max-width: 1140px;
        margin: 0 auto;
        padding: 1.4rem 1.35rem 2.75rem;
        display: grid;
        gap: 1.1rem;
      }

      header.brand {
        position: relative;
        display: grid;
        gap: 0.4rem;
        padding: 0.55rem 0 0.15rem;
      }

      .brand-glow {
        position: absolute;
        left: -4%;
        top: 18%;
        width: min(420px, 70%);
        height: 70%;
        background: radial-gradient(
          ellipse at center,
          rgba(47, 227, 154, 0.35),
          transparent 68%
        );
        filter: blur(22px);
        pointer-events: none;
        z-index: 0;
      }

      .brand-mark {
        position: relative;
        z-index: 1;
        margin: 0;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(3.4rem, 11vw, 6.2rem);
        line-height: 0.88;
        letter-spacing: -0.065em;
        background: linear-gradient(
          118deg,
          #fff 8%,
          var(--accent) 48%,
          var(--accent-2) 92%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 28px rgba(47, 227, 154, 0.28));
      }

      .lede {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      button {
        font: 500 0.72rem/1 "IBM Plex Mono", monospace;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.045);
        color: var(--ink);
        padding: 0.52rem 0.68rem;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition:
          border-color 0.15s ease,
          color 0.15s ease,
          background 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      button:hover {
        border-color: rgba(47, 227, 154, 0.65);
        color: var(--accent);
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(47, 227, 154, 0.12);
      }

      button.active {
        border-color: var(--accent);
        color: #04140c;
        background: var(--accent);
        box-shadow: 0 0 24px rgba(47, 227, 154, 0.35);
      }

      button.new:not(.active) {
        border-color: rgba(255, 200, 87, 0.5);
        color: var(--accent-2);
      }

      button.new.active {
        background: var(--accent-2);
        border-color: var(--accent-2);
        color: #1a1204;
        box-shadow: 0 0 24px rgba(255, 200, 87, 0.32);
      }

      .stage {
        position: relative;
        min-height: 320px;
        border: 1px solid rgba(47, 227, 154, 0.22);
        background:
          linear-gradient(180deg, rgba(47, 227, 154, 0.07), transparent 38%),
          var(--glass);
        backdrop-filter: blur(14px);
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03) inset,
          0 28px 80px rgba(0, 0, 0, 0.45),
          0 0 60px rgba(47, 227, 154, 0.08);
      }

      .stage-beam {
        position: absolute;
        top: 0;
        left: -30%;
        width: 38%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(47, 227, 154, 0.12),
          rgba(255, 200, 87, 0.08),
          transparent
        );
        opacity: 0.35;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(47, 227, 154, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(47, 227, 154, 0.09) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.7), transparent 88%);
        pointer-events: none;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: auto 0 0;
        height: 48%;
        background:
          radial-gradient(ellipse 70% 80% at 50% 100%, rgba(47, 227, 154, 0.16), transparent 70%),
          linear-gradient(0deg, rgba(4, 10, 7, 0.92), transparent);
        pointer-events: none;
      }

      .panel {
        display: none;
        position: relative;
        z-index: 1;
        padding: 1.15rem;
        gap: 0.9rem;
      }

      .panel.active {
        display: grid;
        align-content: start;
        justify-items: stretch;
      }

      .playfield {
        position: relative;
        height: min(320px, 48vh);
        border: 1px solid rgba(47, 227, 154, 0.28);
        background:
          radial-gradient(circle at 20% 30%, rgba(47, 227, 154, 0.08), transparent 45%),
          radial-gradient(circle at 80% 70%, rgba(255, 200, 87, 0.06), transparent 40%),
          rgba(0, 0, 0, 0.32);
        overflow: hidden;
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.35);
      }

      .box {
        position: absolute;
        top: 40%;
        left: 40px;
        width: 72px;
        height: 72px;
        background: linear-gradient(145deg, #6ff5c0, var(--accent), #147a4f);
        box-shadow:
          0 0 24px rgba(47, 227, 154, 0.55),
          0 22px 48px rgba(47, 227, 154, 0.35);
      }

      .box.alt {
        background: linear-gradient(145deg, #ffe09a, var(--accent-2), #9a6d16);
        opacity: 0.3;
        box-shadow:
          0 0 20px rgba(255, 200, 87, 0.4),
          0 22px 48px rgba(255, 200, 87, 0.28);
      }

      .dots {
        height: min(220px, 36vh);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border: 1px solid rgba(47, 227, 154, 0.18);
        background: rgba(0, 0, 0, 0.22);
      }

      .dot {
        width: 28px;
        height: 28px;
        background: var(--accent);
        opacity: 0.25;
      }

      .rail {
        position: relative;
        height: min(200px, 34vh);
        border: 1px solid rgba(47, 227, 154, 0.18);
        overflow: hidden;
        background: rgba(0, 0, 0, 0.25);
      }

      .rail-track {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1rem;
        will-change: transform;
      }

      .rail-item {
        flex: 0 0 88px;
        height: 88px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--line);
      }

      .pin-card {
        position: absolute;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        z-index: 2;
        min-width: 168px;
        padding: 0.95rem 1.15rem;
        background: linear-gradient(145deg, #147a4f, var(--accent));
        color: #04140c;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        text-align: center;
      }

      .pin-card small {
        display: block;
        margin-top: 0.3rem;
        font: 0.72rem/1.3 "IBM Plex Mono", monospace;
        font-weight: 500;
        opacity: 0.8;
      }

      .scrub-box {
        position: absolute;
        top: 38%;
        left: 36px;
        width: 72px;
        height: 72px;
        background: linear-gradient(145deg, var(--accent), #147a4f);
        box-shadow: 0 18px 40px rgba(47, 227, 154, 0.28);
      }

      .slider-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.75rem;
        align-items: center;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent-2);
      }

      .meta {
        font: 0.74rem "IBM Plex Mono", monospace;
        color: var(--muted);
      }

      .center {
        display: grid;
        justify-items: center;
        gap: 0.85rem;
        padding: 0.6rem 0;
      }

      #mm-box {
        width: 148px;
        height: 84px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #04140c;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      #utils-bar {
        width: min(440px, 72vw);
        height: 12px;
        background: rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
      }

      #utils-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      #css-card {
        width: min(300px, 72vw);
        height: 110px;
        display: grid;
        place-items: center;
        background: rgba(47, 227, 154, 0.12);
        border: 1px solid rgba(47, 227, 154, 0.28);
        font-family: "Syne", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        transform: translateY(calc(var(--lift, 0) * -1px));
        box-shadow: 0 calc(var(--lift, 0) * 0.45px) calc(var(--lift, 0) * 1.3px)
          rgba(0, 0, 0, 0.4);
      }

      #attr-svg {
        width: min(300px, 72vw);
        height: 170px;
        border: 1px solid rgba(47, 227, 154, 0.18);
        background: rgba(0, 0, 0, 0.22);
      }

      #delay-meta {
        font: 0.84rem "IBM Plex Mono", monospace;
        color: var(--accent-2);
        min-height: 1.2em;
      }

      #quick-pad {
        width: min(440px, 82vw);
        height: 170px;
        border: 1px solid rgba(47, 227, 154, 0.18);
        background: rgba(0, 0, 0, 0.22);
        position: relative;
        cursor: crosshair;
        touch-action: none;
      }

      #quick-dot {
        position: absolute;
        left: 20px;
        top: 60px;
        width: 30px;
        height: 30px;
        background: var(--accent-2);
        pointer-events: none;
        box-shadow: 0 10px 28px rgba(255, 200, 87, 0.35);
      }

      .footer-rail {
        display: grid;
        gap: 0.55rem;
      }

      #status {
        min-height: 1.2em;
        color: var(--accent-2);
        font: 0.78rem/1.35 "IBM Plex Mono", monospace;
        text-shadow: 0 0 18px rgba(255, 200, 87, 0.25);
      }

      pre {
        margin: 0;
        padding: 0.95rem 1.05rem;
        border: 1px solid rgba(47, 227, 154, 0.2);
        border-left: 3px solid var(--accent);
        background: linear-gradient(
          135deg,
          rgba(47, 227, 154, 0.06),
          rgba(0, 0, 0, 0.5)
        );
        font: 0.74rem/1.5 "IBM Plex Mono", monospace;
        color: #d7eee0;
        white-space: pre-wrap;
        overflow: visible;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      @media (max-width: 640px) {
        .brand-mark {
          font-size: clamp(2.6rem, 15vw, 3.6rem);
        }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>
    <div class="aurora" id="aurora" aria-hidden="true"></div>
    <div class="orb orb-a" id="orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" id="orb-b" aria-hidden="true"></div>
    <div class="orb orb-c" id="orb-c" aria-hidden="true"></div>

    <div class="app" id="app">
      <header class="brand" id="brand">
        <div class="brand-glow" id="brand-glow" aria-hidden="true"></div>
        <h1 class="brand-mark">MorePass</h1>
        <p class="lede">Live motion playground</p>
      </header>

      <div class="controls" id="controls">
        <button data-demo="to" class="active">to()</button>
        <button data-demo="from">from()</button>
        <button data-demo="fromTo">fromTo()</button>
        <button data-demo="timeline">timeline()</button>
        <button data-demo="stagger">stagger</button>
        <button data-demo="color">color</button>
        <button data-demo="overwrite">overwrite</button>
        <button data-demo="yoyo">yoyo</button>
        <button data-demo="keyframes" class="new">keyframes</button>
        <button data-demo="kfScrub" class="new">kf scrub</button>
        <button data-demo="scrub" class="new">scrub</button>
        <button data-demo="pin" class="new">pin</button>
        <button data-demo="once" class="new">once</button>
        <button data-demo="quickTo" class="new">quickTo</button>
        <button data-demo="context" class="new">context</button>
        <button data-demo="autoAlpha" class="new">autoAlpha</button>
        <button data-demo="delayedCall" class="new">delayedCall</button>
        <button data-demo="clearProps" class="new">clearProps</button>
        <button data-demo="cssVar" class="new">css var</button>
        <button data-demo="attr" class="new">attr</button>
        <button data-demo="relative" class="new">relative</button>
        <button data-demo="percent" class="new">percent</button>
        <button data-demo="getById" class="new">getById</button>
        <button data-demo="function" class="new">function</button>
        <button data-demo="snap" class="new">snap</button>
        <button data-demo="then" class="new">then</button>
        <button data-demo="invalidate" class="new">invalidate</button>
        <button data-demo="skew" class="new">skew</button>
        <button data-demo="blur" class="new">blur</button>
        <button data-demo="grid" class="new">grid</button>
        <button data-demo="repeatRefresh" class="new">repeatRefresh</button>
        <button data-demo="interrupt" class="new">interrupt</button>
        <button data-demo="totalProgress" class="new">totalProgress</button>
        <button data-demo="matchMedia" class="new">matchMedia</button>
        <button data-demo="utils" class="new">utils</button>
        <button id="pause">pause</button>
        <button id="reset">reset</button>
      </div>

      <div class="stage" id="stage">
        <div class="stage-beam" id="stage-beam" aria-hidden="true"></div>
        <div class="panel active" id="panel-tween">
          <div class="playfield">
            <div class="box" id="box"></div>
            <div class="box alt" id="box2"></div>
          </div>
        </div>

        <div class="panel" id="panel-stagger">
          <div class="dots" id="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>

        <div class="panel" id="panel-scrub">
          <div class="playfield">
            <div class="scrub-box" id="scrub-box"></div>
          </div>
          <div class="slider-row">
            <span class="meta">scrub</span>
            <input id="scrub-range" type="range" min="0" max="1000" value="0" />
            <span class="meta" id="scrub-val">0.00</span>
          </div>
        </div>

        <div class="panel" id="panel-kf">
          <div class="playfield">
            <div class="scrub-box" id="kf-box"></div>
          </div>
          <div class="slider-row">
            <span class="meta">keyframes</span>
            <input id="kf-range" type="range" min="0" max="1000" value="0" />
            <span class="meta" id="kf-val">0.00</span>
          </div>
        </div>

        <div class="panel" id="panel-pin">
          <div class="rail" id="pin-rail">
            <div class="rail-track" id="pin-track">
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
              <div class="rail-item"></div>
            </div>
            <div class="pin-card" id="pin-card">
              PINNED
              <small id="pin-label">background moves · card stays</small>
            </div>
          </div>
          <div class="slider-row">
            <span class="meta">pin</span>
            <input id="pin-range" type="range" min="0" max="1000" value="0" />
            <span class="meta" id="pin-val">0.00</span>
          </div>
        </div>

        <div class="panel" id="panel-once">
          <div class="playfield">
            <div class="box" id="once-box"></div>
          </div>
          <div class="slider-row">
            <button id="once-play" type="button" class="new">play once</button>
            <span class="meta" id="once-meta">play once · reset to retry</span>
          </div>
        </div>

        <div class="panel" id="panel-quick">
          <div class="center">
            <div id="quick-pad">
              <div id="quick-dot"></div>
            </div>
            <span class="meta">drag · quickTo</span>
          </div>
        </div>

        <div class="panel" id="panel-mm">
          <div class="center">
            <div id="mm-box">wide</div>
            <span class="meta">resize across 800px</span>
          </div>
        </div>

        <div class="panel" id="panel-utils">
          <div class="center">
            <div id="utils-bar"><div id="utils-fill"></div></div>
            <div class="meta" id="utils-label">0</div>
          </div>
        </div>

        <div class="panel" id="panel-delay">
          <div class="playfield">
            <div class="box" id="delay-box"></div>
          </div>
          <div class="center">
            <div class="meta" id="delay-meta">waiting…</div>
          </div>
        </div>

        <div class="panel" id="panel-css">
          <div class="center">
            <div id="css-card">--lift</div>
            <span class="meta" id="css-meta">lift 0</span>
          </div>
        </div>

        <div class="panel" id="panel-attr">
          <div class="center">
            <svg id="attr-svg" viewBox="0 0 280 160" aria-label="attr demo">
              <circle
                id="attr-circle"
                cx="140"
                cy="80"
                r="18"
                fill="#2fe39a"
              />
            </svg>
            <span class="meta" id="attr-meta">r = 18</span>
          </div>
        </div>
      </div>

      <div class="footer-rail">
        <div id="status">ready</div>
        <pre id="code"></pre>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
